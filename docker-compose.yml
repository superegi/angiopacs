version: "3.8"

services:
  postgres-db:
    image: postgres:15
    container_name: angio_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  orthanc-pacs:
    image: jodogne/orthanc-plugins:latest
    container_name: angio_pacs
    ports:
      - "${PORT_ORTHANC_DICOM}:4242"
      - "${PORT_ORTHANC_WEB}:8042"
    environment:
      ORTHANC_NAME: ${ORTHANC_NAME}
      DICOM_AET: ${ORTHANC_AETITLE}
      REMOTE_ACCESS_ALLOWED: "true"
      AUTHENTICATION_ENABLED: "false"
      ORTHANC__ORTHANC_EXPLORER_2__ENABLED: "true"
      ORTHANC__STONE_WEB_VIEWER__ENABLE: "true"
    volumes:
      - ./orthanc-storage:/var/lib/orthanc/db
    restart: unless-stopped

  backend-bot:
    build: ./backend
    container_name: angio_backend_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      DATA_PATH: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    volumes:
      - ./fotos_pacientes:/app/data
    ports:
      - "${PORT_BACKEND}:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      orthanc-pacs:
        condition: service_started

volumes:
  postgres_data:
